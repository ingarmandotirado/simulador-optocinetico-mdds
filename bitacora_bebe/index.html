<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Bitácora de José Gabriel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#5b5fc7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: una sola columna para el teléfono (máx. 560 px), barra de pestañas fija abajo, captura en hojas que suben desde abajo. Cada categoría tiene su color. */
:root{
  --bg:#f2f4fa; --surface:#ffffff; --surface2:#e8ecf6; --fg:#1c2140; --muted:#5b6385; --line:#d9deec;
  --accent:#5b5fc7; --ok:#22915a; --warn:#c98100; --bad:#d13b3b;
  --c-breast:#ee6f62; --c-bottle:#ef9f2f; --c-diaper:#e2b524; --c-poo:#9a6840; --c-sleep:#5b5fc7;
  --c-tummy:#22a08a; --c-solid:#5fa636; --c-pump:#de6b98; --c-temp:#dc4b45; --c-med:#8a59d4;
  --c-sym:#d47b22; --c-bath:#2f93d6; --c-note:#69738f; --c-vax:#1f8f7a; --c-growth:#3b82c4;
  --f-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --tabh:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1121; --surface:#171b31; --surface2:#21264a; --fg:#e8ebfa; --muted:#9aa2c6; --line:#2b3158;
  --accent:#8d90f2; --ok:#46c27f; --warn:#f0a72a; --bad:#ff6b6b;
  --c-breast:#ff8a7d; --c-bottle:#ffb44f; --c-diaper:#f0c94a; --c-poo:#c48f62; --c-sleep:#8d90f2;
  --c-tummy:#3fc4ab; --c-solid:#84c95a; --c-pump:#f08ab3; --c-temp:#ff6f68; --c-med:#ad86f0;
  --c-sym:#f29b47; --c-bath:#5ab3ef; --c-note:#9aa3bf; --c-vax:#3fbfa6; --c-growth:#6aa9e6;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1121; --surface:#171b31; --surface2:#21264a; --fg:#e8ebfa; --muted:#9aa2c6; --line:#2b3158;
  --accent:#8d90f2; --ok:#46c27f; --warn:#f0a72a; --bad:#ff6b6b;
  --c-breast:#ff8a7d; --c-bottle:#ffb44f; --c-diaper:#f0c94a; --c-poo:#c48f62; --c-sleep:#8d90f2;
  --c-tummy:#3fc4ab; --c-solid:#84c95a; --c-pump:#f08ab3; --c-temp:#ff6f68; --c-med:#ad86f0;
  --c-sym:#f29b47; --c-bath:#5ab3ef; --c-note:#9aa3bf; --c-vax:#3fbfa6; --c-growth:#6aa9e6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.1px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.baby{display:flex;align-items:center;gap:12px;flex:1 1 230px;min-width:0}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--f-display);font-size:18px;font-weight:600;flex:none}
.baby h1{font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baby p{margin:0;color:var(--muted);font-size:13px}
.topchips{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.cloud .dot{background:var(--ok)} .pill.local .dot{background:var(--warn)} .pill.offline .dot{background:var(--bad)}

section.view{display:flex;flex-direction:column;gap:16px}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.h2row h2{font-size:17px}
.link{color:var(--accent);font-weight:800;font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* alerts */
.alert{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-weight:600;border:1.5px solid}
.alert b{display:block;font-family:var(--f-display);font-weight:600;font-size:15.5px}
.alert span{font-weight:600;font-size:13.5px}
.alert.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.alert.warn{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.alert.info{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.alert .ai{font-size:22px;line-height:1}

/* timers */
.tcard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 16%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 55%,transparent)}
.ticon{width:46px;height:46px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:24px;grid-row:span 2}
.tt{font-weight:800;font-size:14px}
.tclock{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.05}
.tsub{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-weight:700}
.tbtns{grid-column:1/-1;display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.tbtns button{flex:1;min-width:90px;padding:12px 10px;border-radius:12px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);font-weight:800}
.tbtns button.stop{background:var(--c);color:#fff;border-color:transparent}

/* status */
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;text-align:left}
.st .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800}
.st .v{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.2;margin-top:2px}
.st .s{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.st.good{border-color:color-mix(in srgb,var(--ok) 55%,transparent)} .st.mid{border-color:color-mix(in srgb,var(--warn) 60%,transparent)} .st.hi{border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.st.good .s b{color:var(--ok)} .st.mid .s b{color:var(--warn)} .st.hi .s b{color:var(--bad)}

/* big buttons */
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.small4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 15%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 42%,transparent);padding:14px 8px;min-height:112px;transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile .ic{width:54px;height:54px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:28px;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000 20%)}
.tile .lb{font-family:var(--f-display);font-weight:600;font-size:16px}
.tile .sb{font-size:11.5px;color:var(--muted);font-weight:700;text-align:center;line-height:1.2}
.tile.on{background:var(--c);color:#fff} .tile.on .sb{color:#fff;opacity:.9} .tile.on .ic{background:rgba(255,255,255,.25);box-shadow:none}
.small4 .tile{min-height:88px;padding:10px 4px;gap:4px}
.small4 .tile .ic{width:40px;height:40px;font-size:21px}
.small4 .tile .lb{font-size:13px}

.supps{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.supp{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;border:1.5px dashed color-mix(in srgb,var(--c-med) 60%,transparent);font-weight:800;font-size:13.5px;background:var(--surface)}
.supp.done{border-style:solid;background:color-mix(in srgb,var(--c-med) 16%,var(--surface))}

/* summary */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sm{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.sm .k{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--muted)}
.sm .k i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.sm .v{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.sm .v small{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:700}
.sm .d{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.ev .ei{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));border:2px solid var(--c);display:grid;place-items:center;font-size:19px}
.ev .et{font-weight:800;font-size:14.5px}
.ev .ed{font-size:12.5px;color:var(--muted);font-weight:700;min-width:0;overflow-wrap:anywhere}
.ev .eh{font-family:var(--f-display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
.ev .eh small{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--muted);font-weight:700}
.who{display:inline-block;padding:0 6px;border-radius:6px;font-size:11px;font-weight:800;background:var(--surface2);color:var(--muted);margin-left:4px;vertical-align:1px}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-weight:700;border:1.5px dashed var(--line);border-radius:var(--r)}

.daynav{display:flex;align-items:center;gap:8px}
.daynav button.nav{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:800}
.daynav .dt{flex:1;text-align:center}
.daynav .dt b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px}
.daynav .dt span{font-size:12.5px;color:var(--muted);font-weight:700}

.trend{width:100%;border-collapse:collapse;font-size:13px}
.trend td,.trend th{padding:6px 4px;text-align:left;font-weight:700}
.trend th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.trend .tb{height:10px;border-radius:99px;background:var(--c-sleep);display:block;min-width:2px}
.scrollx{overflow-x:auto}

/* segmented */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* vaccines / checks */
.grp{display:flex;flex-direction:column;gap:6px}
.grp h3{font-size:14.5px;color:var(--muted);margin-top:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;width:100%}
.row .rt{font-weight:800;font-size:14.5px}
.row .rd{font-size:12.5px;color:var(--muted);font-weight:700}
.tag{padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;border:1.5px solid}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.tag.due{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.tag.late{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.tag.next{color:var(--muted);border-color:var(--line)}
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;margin:0;height:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:14px;font-weight:800;font-size:15.5px;background:var(--surface);border:1.5px solid var(--line);width:100%}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.danger.arm{background:var(--bad);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap} .btns>*{flex:1;min-width:130px}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body);font-weight:700}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12px;color:var(--muted)}
.tabs button span{font-size:22px;line-height:1;filter:grayscale(.6);opacity:.75}
.tabs button.on{color:var(--accent)} .tabs button.on span{filter:none;opacity:1}

/* sheet */
.bd{position:fixed;inset:0;z-index:50;background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.bd.open{opacity:1}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:24px 24px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(30px);transition:transform .2s;display:flex;flex-direction:column;gap:14px}
.bd.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sh{display:flex;align-items:center;gap:12px}
.sh .ic{width:44px;height:44px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:23px;flex:none}
.sh h2{flex:1;font-size:21px}
.sh .x{width:40px;height:40px;border-radius:50%;background:var(--surface2);font-size:18px;font-weight:800}
.field{display:flex;flex-direction:column;gap:8px}
.flabel{font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:11px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:14.5px;min-height:46px}
.chip.on{background:var(--c,var(--accent));border-color:transparent;color:#fff}
.tinput{width:auto;min-height:46px;font-weight:800}
.tinput.on{border-color:var(--c,var(--accent));border-width:2px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 45%,transparent);font-family:var(--f-display);font-weight:600;font-size:17px;position:relative}
.choice .e{font-size:34px;line-height:1}
.choice small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700}
.choice.on{background:var(--c);color:#fff;border-color:transparent} .choice.on small{color:#fff}
.badge{position:absolute;top:8px;right:8px;background:var(--fg);color:var(--bg);font-family:var(--f-body);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px}
.amount{display:flex;align-items:center;justify-content:center;gap:16px}
.amount button{width:58px;height:58px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:26px;font-weight:800}
.amount .val{font-family:var(--f-display);font-size:46px;font-weight:600;min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
.amount .val small{font-size:18px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sw{display:flex;align-items:center;gap:8px;padding:9px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:12.5px;text-align:left;line-height:1.15}
.sw i{width:28px;height:28px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.2)}
.sw.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg) inset}
.save{position:sticky;bottom:0;padding-top:6px;background:linear-gradient(transparent,var(--bg) 30%)}
.save .btn{background:var(--c,var(--accent));color:#fff;border-color:transparent;padding:17px;font-size:17px}
.hint{font-size:13px;color:var(--muted);font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:800;color:var(--muted)}

/* toasts */
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + 12px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;max-width:528px;width:100%;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s}
.toast.warn{background:var(--warn);color:#1b1300} .toast.bad{background:var(--bad);color:#fff}
.toast span{flex:1}
.toast button{font-weight:800;padding:6px 10px;border-radius:10px;background:rgba(127,127,127,.25)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:520px){.small4{gap:10px}.small4 .tile{min-height:96px}}
</style>

<div class="wrap">
  <header class="top" id="top"></header>

const sideName = s => s === 'L' ? 'izquierdo' : s === 'R' ? 'derecho' : 'ambos';
const sleepKind = t => { const h = new Date(t).getHours(); return (h >= 19 || h < 6) ? 'Sueño nocturno' : 'Siesta'; };

/* ============ almacenamiento (compartido o local) ============ */
const B = {
  db: null, queues: {}, local: null,
  async init() {
    let db = null;
    if (window.claude && typeof window.claude.use === 'function') { try { db = await window.claude.use('db'); } catch (e) { db = null; } }
    if (db) { this.db = db; S.mode = 'cloud'; this.subscribe(); }
    else { this.initLocal(); }
    render();
  },
  initLocal() {
    S.mode = 'local';
    const saved = LS.get('bb_data') || { days: {}, meta: {} };
    this.local = saved; S.days = saved.days || {}; S.meta = Object.assign(S.meta, saved.meta || {});
    for (const e of events()) S.seen.add(e.id);
    S.loaded = true; S.rev++;
  },
  saveLocal() { LS.set('bb_data', { days: S.days, meta: S.meta }); },
  subscribe() {
    const timer = setTimeout(() => { if (!S.loaded) { S.offline = true; render(); } }, 10000);
    this.db.collection('days').orderBy('date', 'desc').limit(62).onSnapshot(snap => {
      clearTimeout(timer);
      S.offline = snap.metadata.fromCache && !snap.metadata.hasPendingWrites;
      const fresh = [];
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed') { /* fuera de la ventana: lo conservamos */ continue; }
        const data = ch.doc.data() || {}; S.days[ch.doc.id] = data;
        const evs = data.events || {};
        for (const id in evs) { const e = evs[id]; if (!e) continue; if (!S.seen.has(id)) { S.seen.add(id); if (S.loaded && e.by && e.by !== S.me && Date.now() - (e.at || e.t) < 3 * MIN) fresh.push(Object.assign({ id }, e)); } }
      }
      S.loaded = true; S.rev++; render();
      fresh.slice(0, 3).forEach(e => toast(`${e.by} registró ${iconOf(e)} ${titleOf(e)} · ${fmtT(e.t)}`, { kind: 'info' }));
    }, err => { S.offline = true; render(); toast('No se pudo conectar con la bitácora compartida (' + (err && err.code) + ').', { kind: 'bad' }); });
    this.db.collection('meta').onSnapshot(snap => {
      const prevActive = S.meta.active || {};
      for (const d of snap.docs) S.meta[d.id] = d.data() || {};
      const a = S.meta.active || {};
      if (S.metaLoaded) for (const k of ['breast', 'sleep', 'tummy']) {
        if (a[k] && (!prevActive[k] || prevActive[k].t !== a[k].t) && a[k].by && a[k].by !== S.me) toast(`${a[k].by} inició: ${k === 'breast' ? '🤱 Lactancia' : k === 'sleep' ? '😴 Durmiendo' : '🐢 Tiempo de barriga'}`, { kind: 'info' });
      }
      S.metaLoaded = true; S.rev++; render(); if (F) refreshSheetIfTimer();
    }, () => { });
  },
  enqueue(path, fn) { const q = (this.queues[path] || Promise.resolve()).then(fn, fn); this.queues[path] = q.catch(() => { }); return q; },
  async merge(path, patch, createBody) {
    if (S.mode === 'local') {
      const [col, id] = path.split('/'); const store = col === 'days' ? S.days : S.meta;
      store[id] = deepMerge(store[id] ? clone(store[id]) : {}, createBody || patch);
      if (store[id] && createBody) deepMerge(store[id], patch);
      S.rev++; this.saveLocal(); render(); return;
    }
    return this.enqueue(path, async () => {
      const ref = this.db.doc(path);
      for (let attempt = 0; attempt < 2; attempt++) {
        try { await ref.update(patch); return; }
        catch (e) {
          const code = e && e.code;
          if (code === 'invalid_argument' || code === 'transform_error') {
            const snap = await ref.get().catch(() => null);
            if (snap && !snap.exists) { await ref.set(deepMerge(clone(createBody || {}), patch)); if (path.startsWith('days/') && patch.events) this.verify(ref, patch.events); return; }
            throw e;
          }
          if (code === 'unavailable' && attempt === 0) { await sleepMs(400 + Math.random() * 600); continue; }
          throw e;
        }
      }
    }).catch(e => { toast(writeErr(e), { kind: 'bad', ms: 7000 }); throw e; });
  },
  verify(ref, evs) { // si el otro teléfono creó el mismo día a la vez, reescribe lo que se haya perdido
    setTimeout(async () => { try { const s = await ref.get(); const cur = (s.data() || {}).events || {}; const miss = {}; for (const id in evs) if (evs[id] && !cur[id]) miss[id] = evs[id]; if (Object.keys(miss).length) await ref.update({ events: miss }); } catch (e) { } }, 2500);
  },
  patchDay(key, patch) { return this.merge('days/' + key, patch, { date: key, events: {} }); },
  patchMeta(name, patch) { return this.merge('meta/' + name, patch, {}); },
  async fetchDay(key) {
    if (S.mode !== 'cloud' || S.days[key] || this._f && this._f[key]) return;
    (this._f = this._f || {})[key] = true;
    try { const s = await this.db.doc('days/' + key).get(); if (s.exists) { S.days[key] = s.data(); S.rev++; render(); } } catch (e) { }
  }
};
function writeErr(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return 'No se guardó: tu cuenta solo puede ver esta bitácora. Pide acceso de Editor.';
  if (c === 'quota_exceeded') return 'No se guardó: la bitácora llegó a su límite de espacio. Exporta y depura datos antiguos.';
  if (c === 'revoked' || c === 'not_granted') return 'No se guardó: se perdió el acceso a la bitácora compartida.';
  return 'No se guardó por un problema de conexión. Intenta de nuevo.';
}

/* ============ registrar eventos ============ */
const DUP = {
  breast: { m: 25 }, bottle: { m: 25 }, solid: { m: 30 }, pump: { m: 20 }, bath: { m: 180 }, tummy: { m: 5 }, sleep: { m: 15 },
  temp: { m: 10 }, diaper: { m: 10, same: (a, b) => (a.pee && b.pee) || (a.poo && b.poo) },
  med: { m: 240, same: (a, b) => norm(a.name) === norm(b.name) },
  symptom: { m: 15, same: (a, b) => (a.kinds || []).some(k => (b.kinds || []).includes(k)) },
};
function findDup(ev) {
  const r = DUP[ev.type]; if (!r) return null;
  return events().find(e => e.type === ev.type && e.id !== ev.id && Math.abs(e.t - ev.t) < r.m * MIN && (!r.same || r.same(ev, e))) || null;
}
function saveEvent(ev, opts = {}) {
  if (!S.me) { askWho(() => saveEvent(ev, opts)); return; }
  if (!opts.force) {
    const d = findDup(ev);
    if (d) { showDup(ev, d, opts); return; }
  }
  commit(ev, opts);
}
function commit(ev, opts = {}) {
  ev.id = ev.id || rid(); ev.by = S.me; ev.at = Date.now();
  Object.keys(ev).forEach(k => (ev[k] === undefined || ev[k] === '') && delete ev[k]);
  const key = keyOf(ev.t); S.seen.add(ev.id);
  const { id, ...body } = ev;
  B.patchDay(key, { events: { [id]: body } }).then(() => { }, () => { });
  if (!opts.keepSheet) closeSheet();
  toast(`${iconOf(ev)} ${titleOf(ev)} · ${fmtT(ev.t)} guardado`, { action: 'Deshacer', fn: () => removeEvent(key, id, true) });
  if (opts.after) opts.after(ev);
}
function removeEvent(key, id, silent) { B.patchDay(key, { events: { [id]: null } }).then(() => { }, () => { }); if (!silent) toast('Registro eliminado'); else toast('Se deshizo el registro'); }
function showDup(ev, d, opts) {
  const mins = Math.round(Math.abs(Date.now() - d.t) / MIN);
  const who = d.by === S.me ? 'Tú ya registraste' : (d.by || 'Alguien') + ' ya registró';
  const isMed = ev.type === 'med';
  F = Object.assign(F || {}, { dupEv: ev, dupOpts: opts, type: F ? F.type : ev.type });
  sheetEl.innerHTML = `<div class="grab"></div>
  <div class="sh" style="--c:var(--${isMed ? 'bad' : 'warn'})"><div class="ic">⚠️</div><h2>¿Ya se había registrado?</h2><button class="x" data-a="close" aria-label="Cerrar">✕</button></div>
  <div class="alert ${isMed ? 'bad' : 'warn'}"><div class="ai">${iconOf(d)}</div><div><b>${esc(who)} ${esc(titleOf(d).toLowerCase())}</b><span>${esc(describe(d))} · a las ${fmtT(d.t)} (${d.t <= Date.now() ? 'hace ' + durTxt(mins) : 'en ' + durTxt(mins)})</span></div></div>
  ${isMed ? `<div class="hint">Antes de repetir una dosis, confirma el intervalo indicado por su pediatra. Dar dos veces el mismo medicamento por error es el accidente más común entre dos cuidadores.</div>` : `<div class="hint">Tu registro sería: ${iconOf(ev)} ${esc(titleOf(ev))} · ${esc(describe(ev))} · ${fmtT(ev.t)}</div>`}
  <div class="btns"><button class="btn" data-a="dup-no">Es el mismo, no guardar</button><button class="btn pri" data-a="dup-yes">Es otro, guardar</button></div>`;
  openBackdrop();
}

/* ============ temporizadores (compartidos) ============ */
function sideMs(b, s, now = Date.now()) { return ((b.acc && b.acc[s]) || 0) + (!b.paused && b.side === s && b.seg ? now - b.seg : 0); }
function breastTotal(b, now = Date.now()) { return sideMs(b, 'L', now) + sideMs(b, 'R', now); }
function activeOf(k) { return (S.meta.active || {})[k] || null; }
function setActive(k, v) { return B.patchMeta('active', { [k]: v }).then(() => { }, () => { }); }
function startTimer(k, t, extra = {}) {
  if (!S.me) { askWho(() => startTimer(k, t, extra)); return; }
  const cur = activeOf(k);
  if (cur) { toast(`Ya está corriendo desde las ${fmtT(cur.t)}${cur.by ? ' (lo inició ' + cur.by + ')' : ''}`, { kind: 'warn' }); return; }
  const v = Object.assign({ t, by: S.me }, extra);
  S.meta.active = Object.assign({}, S.meta.active, { [k]: v }); S.rev++;
  setActive(k, v); closeSheet(); render();
}
function breastStart(side, t) { startTimer('breast', t, { side, first: side, seg: t, acc: { L: 0, R: 0 }, paused: false }); }
function breastSwitch() { const b = activeOf('breast'); if (!b) return; const now = Date.now(); const acc = { L: sideMs(b, 'L', now), R: sideMs(b, 'R', now) }; const nb = Object.assign({}, b, { acc, side: b.side === 'L' ? 'R' : 'L', seg: b.paused ? null : now }); localActive('breast', nb); setActive('breast', nb); }
function breastPause() { const b = activeOf('breast'); if (!b) return; const now = Date.now(); let nb; if (b.paused) nb = Object.assign({}, b, { paused: false, seg: now }); else nb = Object.assign({}, b, { paused: true, seg: null, acc: { L: sideMs(b, 'L', now), R: sideMs(b, 'R', now) } }); localActive('breast', nb); setActive('breast', nb); }
function breastStop() {
  const b = activeOf('breast'); if (!b) return; const now = Date.now();
  const L = Math.round(sideMs(b, 'L', now) / MIN), R = Math.round(sideMs(b, 'R', now) / MIN);
  localActive('breast', null); setActive('breast', null);
  commit({ type: 'breast', t: b.t, end: now, L, R, first: b.first || b.side, last: b.side });
}
function localActive(k, v) { S.meta.active = Object.assign({}, S.meta.active, { [k]: v }); S.rev++; render(); if (F) refreshSheetIfTimer(); }
function tummyStop() { const a = activeOf('tummy'); if (!a) return; const now = Date.now(); localActive('tummy', null); setActive('tummy', null); commit({ type: 'tummy', t: a.t, min: Math.max(1, Math.round((now - a.t) / MIN)) }); }

function lmsAt(metric, m) {
  const d = WHO[metric].d; if (m < 0 || m > 12) return null;
  const i = Math.min(11, Math.floor(m)), f = m - i; const a = d[i], b = d[i + 1];

}

  const z = zOf(metric, m, x); if (z == null) return '';

  F = Object.assign({ type, t: Date.now(), tMode: '0' }, SHEETS[type].init ? SHEETS[type].init() : {}, init);
  renderSheet(); openBackdrop(); sheetEl.scrollTop = 0;
}
function renderSheet() { if (!F) return; const sc = sheetEl.scrollTop; sheetEl.innerHTML = '<div class="grab"></div>' + SHEETS[F.type].render(); sheetEl.scrollTop = sc; }
function refreshSheetIfTimer() { if (F && ['breast', 'sleep', 'tummy'].includes(F.type) && !F.dupEv) renderSheet(); }
function head(title, emoji, c) { return `<div class="sh" style="--c:var(--c-${c})"><div class="ic">${emoji}</div><h2>${esc(title)}</h2><button class="x" data-a="close" aria-label="Cerrar">✕</button></div>`; }
function timeRow(label = '¿A qué hora?', opts = [0, 5, 15, 30, 60]) {
  return `<div class="field"><div class="flabel">${label}</div><div class="chips">${opts.map(v => `<button class="chip ${F.tMode === String(v) ? 'on' : ''}" data-a="ago" data-v="${v}">${v === 0 ? 'Ahora' : v < 60 ? '−' + v + ' min' : '−' + v / 60 + ' h'}</button>`).join('')}<input type="time" class="tinput ${F.tMode === 'custom' ? 'on' : ''}" id="f-time" value="${fmtT(F.t)}" aria-label="Hora exacta"></div></div>`;
}
function chips(key, items, opts = {}) {
  return `<div class="chips">${items.map(it => { const [v, l] = Array.isArray(it) ? it : [it, it]; const on = opts.multi ? (F[key] || []).includes(v) : F[key] === v; return `<button class="chip ${on ? 'on' : ''}" data-a="${opts.multi ? 'mset' : 'set'}" data-k="${key}" data-v="${esc(v)}">${esc(l)}</button>`; }).join('')}</div>`;
}
function saveBtn(label = 'Guardar', act = 'save') { return `<div class="save"><button class="btn" data-a="${act}">${label}</button></div>`; }
function amountBox(key, unit, step) { return `<div class="amount"><button data-a="num" data-k="${key}" data-v="-${step}" aria-label="Menos">−</button><div class="val">${F[key]}<small> ${unit}</small></div><button data-a="num" data-k="${key}" data-v="${step}" aria-label="Más">＋</button></div>`; }
const ML_CHIPS = [30, 60, 90, 120, 150, 180, 210, 240], OZ_CHIPS = [1, 2, 3, 4, 5, 6, 7, 8];
function unitToggle() { return `<div class="seg" role="group" aria-label="Unidad de volumen">${['ml', 'oz'].map(u => `<button class="${S.unit === u ? 'on' : ''}" data-a="unit" data-v="${u}" aria-pressed="${S.unit === u}">${u === 'ml' ? 'Mililitros (ml)' : 'Onzas (oz)'}</button>`).join('')}</div>`; }
function volumeBox(n) {
  const oz = S.unit === 'oz'; const list = (oz ? OZ_CHIPS : ML_CHIPS).slice(0, n);
  return unitToggle() + `<div class="amount"><button data-a="vnum" data-v="-1" aria-label="Menos">−</button><div class="val">${oz ? fmtOz(F.ml / OZ) : Math.round(F.ml)}<small> ${oz ? 'oz' : 'ml'}</small></div><button data-a="vnum" data-v="1" aria-label="Más">＋</button></div>
  <div class="small muted num" style="text-align:center;font-weight:800;margin-top:-8px">= ${oz ? Math.round(F.ml) + ' ml' : fmtOz(F.ml / OZ) + ' oz'}</div>
  <div class="chips" style="justify-content:center">${list.map(v => { const ml = oz ? Math.round(v * OZ) : v; return `<button class="chip ${Math.abs(F.ml - ml) <= 1 ? 'on' : ''}" data-a="vset" data-v="${ml}">${v}${oz ? ' oz' : ''}</button>`; }).join('')}</div>`;
}
function setUnit(u) { S.unit = u === 'oz' ? 'oz' : 'ml'; LS.set('bb_unit', S.unit); render(); }
const wrapC = (c, html) => `<div style="--c:var(--c-${c});display:flex;flex-direction:column;gap:14px">${html}</div>`;

      <div class="field"><div class="flabel">Consistencia</div>${chips('texture', TEXTURE)}</div>
      ${STOOL.find(s => s.id === F.color && s.alert) ? `<div class="alert ${STOOL.find(s => s.id === F.color).alert}"><div class="ai">⚠️</div><div><b>Color para revisar con el pediatra</b><span>${F.color === 'blanco' || F.color === 'palido' ? 'Compáralo con la tarjeta colorimétrica de su cartilla. Las heces pálidas o blancas requieren valoración el mismo día.' : 'Toma una foto del pañal para mostrarla en la consulta.'}</span></div></div>` : ''}
      ${saveBtn('Guardar ' + (k === 'both' ? 'pipí y popó' : 'popó'))}` : ''}`);
    },
    save() { commitOrDup({ type: 'diaper', t: F.t, pee: F.kind === 'both', poo: true, color: F.color, texture: F.texture }); }

  breast: {

      const lb = lastOf('breast'); const sug = F.side;

      ${lb ? `<div class="hint">Última toma ${agoTxt(lb.t)} (${fmtT(lb.t)}): ${esc(describe(lb))}.${sug ? ' Ofrece primero el lado <b>' + sideName(sug) + '</b>.' : ''}</div>` : ''}

        <button class="choice" style="--c:var(--c-breast)" data-a="bstart" data-v="R">${sug === 'R' ? '<span class="badge">Sugerido</span>' : ''}<span class="e">➡️</span>Derecho<small>Iniciar temporizador</small></button>

        <div class="hint">Sueño seguro: boca arriba, en su cuna, colchón firme, sin almohadas, cobijas sueltas ni peluches.</div>`);
    },
    save() {
      const a = activeOf('sleep'); if (!a) { closeSheet(); return; }
      const end = Math.max(F.t, a.t + MIN); localActive('sleep', null); setActive('sleep', null);
      commit({ type: 'sleep', t: a.t, end, quality: F.quality, place: F.place });

  tummy: {
    init: () => ({ min: 5 }),

  solid: {
    init: () => ({ foods: [], amount: 'Poco', reaction: null, newFood: '' }),

      const known = new Set(events().filter(e => e.type === 'solid').flatMap(e => e.foods || []));

      <div class="field"><div class="flabel">¿Qué comió?</div><div class="chips">${all.map(f => `<button class="chip ${F.foods.includes(f) ? 'on' : ''}" data-a="mset" data-k="foods" data-v="${esc(f)}">${esc(f)}${!known.has(f) ? '' : ''}</button>`).join('')}</div>

  /* ---- edición ---- */
  edit: {

async function doExport() {
  const data = JSON.stringify({ app: 'bitacora-bebe', version: 1, exportedAt: new Date().toISOString(), days: S.days, meta: S.meta }, null, 1);
  const filename = 'bitacora-' + norm((S.meta.profile || {}).name || 'bebe').replace(/\s+/g, '-') + '-' + todayKey() + '.json';
  let dl = null; if (window.claude && window.claude.use) { try { dl = await window.claude.use('downloads'); } catch (e) { } }
  if (dl) { try { await dl.save({ filename, data }); toast('Respaldo listo'); } catch (e) { if (e && e.code !== 'declined') toast('No se pudo descargar (' + (e.code || 'error') + ')', { kind: 'bad' }); } return; }
  if (S.mode === 'local') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return; }
  try { await navigator.clipboard.writeText(data); toast('Copié el respaldo al portapapeles'); } catch (e) { toast('No se pudo exportar en esta vista', { kind: 'bad' }); }
}

    const j = JSON.parse(await f.text()); if (!j || !j.days || !j.meta) throw new Error('formato');
    let n = 0;
    for (const k of Object.keys(j.days)) { if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue; const evs = (j.days[k] || {}).events || {}; const clean = {}; for (const id in evs) if (evs[id] && /^[A-Za-z0-9_\-]+$/.test(id)) { clean[id] = evs[id]; n++; S.seen.add(id); } if (Object.keys(clean).length) await B.patchDay(k, { events: clean }).catch(() => { }); }
    for (const name of ['profile', 'vaccines', 'growth', 'health', 'prefs']) if (isObj(j.meta[name]) && Object.keys(j.meta[name]).length) await B.patchMeta(name, j.meta[name]).catch(() => { });
    toast('Importados ' + n + ' registros');
  } catch (err) { toast('Ese archivo no es un respaldo válido de la bitácora', { kind: 'bad' }); }
});

/* ============ toasts, reloj y arranque ============ */
function toast(msg, o = {}) {
  const el = document.createElement('div'); el.className = 'toast ' + (o.kind === 'warn' ? 'warn' : o.kind === 'bad' ? 'bad' : '');
  const sp = document.createElement('span'); sp.textContent = msg; el.appendChild(sp);
  if (o.action) { const b = document.createElement('button'); b.textContent = o.action; b.onclick = () => { o.fn && o.fn(); el.remove(); }; el.appendChild(b); }
  const box = $('#toasts'); box.appendChild(el); while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => el.remove(), o.ms || (o.action ? 6000 : 3500));
}
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-since]').forEach(el => { el.textContent = clock(now - Number(el.dataset.since)); });
  const b = activeOf('breast');
  if (b) { document.querySelectorAll('[data-tick="breast"]').forEach(el => el.textContent = clock(breastTotal(b, now))); document.querySelectorAll('[data-tick="breast-sub"]').forEach(el => el.textContent = `Izq ${clock(sideMs(b, 'L', now))} · Der ${clock(sideMs(b, 'R', now))} · inició ${b.by || ''} a las ${fmtT(b.t)}`); }
}
setInterval(tick, 1000);
setInterval(() => { if (!document.hidden) render(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
function route() { const h = (location.hash || '').replace('#', ''); S.view = ['inicio', 'bitacora', 'salud', 'ajustes'].includes(h) ? h : 'inicio'; if (S.view !== 'bitacora') S.logDay = todayKey(); render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);
S.view = ['inicio', 'bitacora', 'salud', 'ajustes'].includes((location.hash || '').slice(1)) ? location.hash.slice(1) : 'inicio';
render();
B.init();
</script>
